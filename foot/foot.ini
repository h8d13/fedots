# atom-dark (matches micro/settings.json colorscheme)
[main]
initial-window-mode=maximized
font=monospace:size=12

[colors-dark]
foreground=c5c8c6
background=1d1f21

selection-foreground=c5c8c6
selection-background=373b41
# <text> <cursor>
cursor=1d1f21 c5c8c6

## normal
regular0=2d2f31  # black
regular1=d75f5f  # red
regular2=a6e22e  # green
regular3=eeee77  # yellow
regular4=62b1fe  # blue
regular5=d33682  # magenta
regular6=c6c5fe  # cyan
regular7=c5c8c6  # white

## bright
bright0=7c7c7c   # black
bright1=ff4444   # red
bright2=a8ff60   # green
bright3=f9ee98   # yellow
bright4=96cbfe   # blue
bright5=ff73fd   # magenta
bright6=dfdffe   # cyan
bright7=eaeaea   # white
